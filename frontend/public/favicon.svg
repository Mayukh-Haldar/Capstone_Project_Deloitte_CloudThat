<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Blue rounded square background -->
  <rect width="32" height="32" rx="7" fill="#1132d4"/>
  <!-- Calendar outline -->
  <rect x="6" y="9" width="20" height="17" rx="2.5" fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Header divider line -->
  <line x1="6" y1="15" x2="26" y2="15" stroke="white" stroke-width="1.8"/>
  <!-- Top hooks -->
  <line x1="11" y1="6.5" x2="11" y2="11.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="6.5" x2="21" y2="11.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Grid dots -->
  <rect x="10" y="18" width="2.5" height="2.5" rx="0.5" fill="white"/>
  <rect x="14.75" y="18" width="2.5" height="2.5" rx="0.5" fill="white"/>
  <rect x="19.5" y="18" width="2.5" height="2.5" rx="0.5" fill="white"/>
  <rect x="10" y="22" width="2.5" height="2.5" rx="0.5" fill="white"/>
  <rect x="14.75" y="22" width="2.5" height="2.5" rx="0.5" fill="white"/>
</svg>
