events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_status 429;

  upstream auth_service {
    server auth-service:8081 max_fails=3 fail_timeout=30s;
  }

  upstream event_service {
    server event-service:8082 max_fails=3 fail_timeout=30s;
  }

  upstream venue_vendor_service {
    server venue-vendor-service:8083 max_fails=3 fail_timeout=30s;
  }

  upstream ticketing_service {
    server ticketing-service:8084 max_fails=3 fail_timeout=30s;
  }

  upstream finance_service {
    server finance-service:8085 max_fails=3 fail_timeout=30s;
  }

  upstream notification_service {
    server notification-service:8086 max_fails=3 fail_timeout=30s;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    error_page 429 = @rate_limited;

    location @rate_limited {
      add_header Content-Type text/plain always;
      add_header Retry-After 1 always;
      return 429 "Too Many Requests\n";
    }

    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/account-requests/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/categories {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://event_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/budget {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://finance_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/reports/financial {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://finance_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/ticket-types {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/registrations {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/checkin/stats {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/waitlist {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/vendors {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://venue_vendor_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/events/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://event_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/events {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://event_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/venues/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://venue_vendor_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/venues {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://venue_vendor_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/vendors/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://venue_vendor_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/vendors {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://venue_vendor_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/contracts/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://venue_vendor_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/registrations/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/tickets/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/checkin/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ticket-types {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/attendees/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://ticketing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/payments/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://finance_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/expenses/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://finance_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/budgets/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://finance_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/notifications/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
      return 200 "EventZen API Gateway\n";
      add_header Content-Type text/plain;
    }
  }
}
