events {}

http {
  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map "" $auth_service_url {
    default http://auth-service:8081;
  }

  map "" $event_service_url {
    default http://event-service:8082;
  }

  map "" $venue_vendor_service_url {
    default http://venue-vendor-service:8083;
  }

  map "" $ticketing_service_url {
    default http://ticketing-service:8084;
  }

  map "" $finance_service_url {
    default http://finance-service:8085;
  }

  map "" $notification_service_url {
    default http://notification-service:8086;
  }

  map "" $frontend_service_url {
    default http://frontend:80;
  }

  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_status 429;

  upstream auth_service {
    server auth-service:8081 max_fails=3 fail_timeout=30s;
  }

  upstream frontend_service {
    server frontend:80 max_fails=3 fail_timeout=30s;
  }

  upstream event_service {
    server event-service:8082 max_fails=3 fail_timeout=30s;
  }

  upstream venue_vendor_service {
    server venue-vendor-service:8083 max_fails=3 fail_timeout=30s;
  }

  upstream ticketing_service {
    server ticketing-service:8084 max_fails=3 fail_timeout=30s;
  }

  upstream finance_service {
    server finance-service:8085 max_fails=3 fail_timeout=30s;
  }

  upstream notification_service {
    server notification-service:8086 max_fails=3 fail_timeout=30s;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    error_page 429 = @rate_limited;

    location @rate_limited {
      add_header Content-Type text/plain always;
      add_header Retry-After 1 always;
      return 429 "Too Many Requests\n";
    }

    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass $auth_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass $auth_service_url/api/v1/auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/account-requests/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass $auth_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/account-requests {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass $auth_service_url/api/v1/account-requests;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass $auth_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/users/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass $auth_service_url/api/v1/users;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/users {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass $auth_service_url/api/v1/users;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
      proxy_pass $auth_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/categories {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $event_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/budget {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $finance_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/reports/financial {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $finance_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/ticket-types {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/registrations {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/checkin/stats {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/waitlist {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/events/[^/]+/vendors {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $venue_vendor_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/events/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $event_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/events {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $event_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/venues/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $venue_vendor_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/venues {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $venue_vendor_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/vendors/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $venue_vendor_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/vendors {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $venue_vendor_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/contracts/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $venue_vendor_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/contracts {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $venue_vendor_service_url/api/v1/contracts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/registrations(/|$) {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/tickets/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/tickets {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url/api/v1/tickets;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/checkin/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/checkin {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url/api/v1/checkin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ticket-types {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/attendees/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/attendees {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $ticketing_service_url/api/v1/attendees;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/payments(/|$) {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $finance_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/expenses/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $finance_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/expenses {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $finance_service_url/api/v1/expenses;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/budgets/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $finance_service_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/budgets {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $finance_service_url/api/v1/budgets;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/notifications/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $notification_service_url;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/notifications {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass $notification_service_url/api/v1/notifications;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass $notification_service_url;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
      return 302 /docs/;
    }

    location ^~ /docs/openapi-specs/auth-service.json {
      proxy_pass $auth_service_url/v3/api-docs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs/openapi-specs/event-service.json {
      proxy_pass $event_service_url/v3/api-docs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs/openapi-specs/finance-service.json {
      proxy_pass $finance_service_url/v3/api-docs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs/openapi-specs/ticketing-service.json {
      proxy_pass $ticketing_service_url/openapi/v1.json;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs/openapi-specs/venue-vendor-service.json {
      proxy_pass $venue_vendor_service_url/openapi.json;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs/openapi-specs/notification-service.json {
      proxy_pass $notification_service_url/openapi.json;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /docs/index.html;
    }

    # SignalR hub for real-time seat-map updates (ticketing-service)
    # Uses the named upstream block (not a variable) so nginx WebSocket keepalive works correctly.
    location /seat-hub {
      proxy_pass http://ticketing_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    location / {
      proxy_pass $frontend_service_url;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
