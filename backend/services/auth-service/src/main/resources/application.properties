spring.application.name=auth-service
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
server.port=8081

# Production: set AUTH_DB_URL / AUTH_DB_USERNAME / AUTH_DB_PASSWORD in .env or the host environment.
# Localhost default below is only for local development.
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/eventzen_users?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${AUTH_DB_USERNAME:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.tracing.enabled=true
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Production: replace these through AUTH_JWT_SECRET and AUTH_CRYPTO_SECRET before deployment.
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.issuer=${AUTH_JWT_ISSUER:eventzen-auth-service}
auth.jwt.access-token-minutes=${AUTH_JWT_ACCESS_TOKEN_MINUTES:15}
auth.jwt.refresh-token-days=${AUTH_JWT_REFRESH_TOKEN_DAYS:7}
auth.crypto.secret=${AUTH_CRYPTO_SECRET:}

# Production: use a real bootstrap admin email/password or disable this bootstrap path after initial setup.
auth.bootstrap.admin-email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
auth.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
auth.bootstrap.admin-first-name=${AUTH_BOOTSTRAP_ADMIN_FIRST_NAME:System}
auth.bootstrap.admin-last-name=${AUTH_BOOTSTRAP_ADMIN_LAST_NAME:Administrator}
auth.features.password-reset-minutes=${AUTH_PASSWORD_RESET_MINUTES:30}
auth.features.email-verification-hours=${AUTH_EMAIL_VERIFICATION_HOURS:24}
auth.features.google-client-id=${AUTH_GOOGLE_CLIENT_ID:}
auth.features.require-verified-email-for-login=${AUTH_REQUIRE_VERIFIED_EMAIL_FOR_LOGIN:false}
auth.features.expose-debug-tokens=${AUTH_EXPOSE_DEBUG_TOKENS:false}
auth.features.allow-debug-google-tokens=${AUTH_ALLOW_DEBUG_GOOGLE_TOKENS:false}

# Production: uncomment/enable the SMTP env vars on the host if auth-service must send email directly.
spring.mail.host=${AUTH_SMTP_HOST:}
spring.mail.port=${AUTH_SMTP_PORT:587}
spring.mail.username=${AUTH_SMTP_USERNAME:}
spring.mail.password=${AUTH_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${AUTH_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${AUTH_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${AUTH_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${AUTH_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${AUTH_SMTP_WRITE_TIMEOUT:5000}

auth.mail.from-email=${AUTH_MAIL_FROM_EMAIL:${AUTH_SMTP_USERNAME:no-reply@example.com}}
auth.mail.from-name=${AUTH_MAIL_FROM_NAME:EventZen}

# Production: point these to the real frontend URL and notification-service base URL.
auth.mail.app-base-url=${AUTH_APP_BASE_URL:http://localhost:5173}
auth.notification.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8086}
auth.notification.internal-service-key=${NOTIFICATION_INTERNAL_SERVICE_KEY:}
