spring.datasource.url=jdbc:h2:mem:eventzen_auth;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
auth.jwt.secret=test-secret-test-secret-test-secret-test-secret-123456
auth.jwt.issuer=test-eventzen-auth-service
auth.jwt.access-token-minutes=15
auth.jwt.refresh-token-days=7
auth.crypto.secret=test-field-encryption-secret-32-chars
auth.bootstrap.admin-email=admin@test.local
auth.bootstrap.admin-password=Admin@12345
auth.bootstrap.admin-first-name=Test
auth.bootstrap.admin-last-name=Admin
auth.features.password-reset-minutes=30
auth.features.email-verification-hours=24
auth.features.google-client-id=test-google-client-id
auth.features.require-verified-email-for-login=false
auth.features.expose-debug-tokens=true
auth.features.allow-debug-google-tokens=true
auth.mail.from-email=no-reply@test.local
auth.mail.from-name=EventZen Test
auth.mail.app-base-url=http://localhost:5173
auth.notification.base-url=http://localhost:8086
auth.notification.internal-service-key=test-internal-key
