spring.application.name=event-service
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
server.port=8082

# Production: set EVENT_DB_URL / EVENT_DB_USERNAME / EVENT_DB_PASSWORD in the runtime environment.
spring.datasource.url=${EVENT_DB_URL:jdbc:mysql://localhost:3306/eventzen_events?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${EVENT_DB_USERNAME:root}
spring.datasource.password=${EVENT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.tracing.enabled=true
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

# Production: supply AUTH_JWT_SECRET from the shared auth-service secret store.
event.jwt.secret=${AUTH_JWT_SECRET:}
event.jwt.issuer=${AUTH_JWT_ISSUER:eventzen-auth-service}

# Production: replace localhost URLs/origins with deployed service URLs and frontend origin.
event.client.venue-vendor-base-url=${VENUE_VENDOR_SERVICE_URL:http://localhost:8083}
event.client.notification-base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
event.client.ticketing-base-url=${TICKETING_SERVICE_URL:http://localhost:8084}
event.client.notification-internal-service-key=${NOTIFICATION_INTERNAL_SERVICE_KEY:eventzen-internal-key}

# Kafka producer — notification events are published to topics consumed by notification-service
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
# Disable Kafka from the actuator health check — producer failures are logged, not fatal
management.health.kafka.enabled=false
# Do not fail startup if Kafka admin cannot reach the broker immediately
spring.kafka.admin.fail-fast=false
event.cors.allowed-origins=${EVENT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
event.storage.enabled=${EVENT_STORAGE_ENABLED:false}
event.storage.endpoint=${EVENT_STORAGE_ENDPOINT:http://localhost:9000}
event.storage.access-key=${EVENT_STORAGE_ACCESS_KEY:}
event.storage.secret-key=${EVENT_STORAGE_SECRET_KEY:}
event.storage.bucket=${EVENT_STORAGE_BUCKET:eventzen-media}
event.storage.public-base-url=${EVENT_STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
event.storage.event-banners-prefix=${EVENT_STORAGE_EVENT_BANNERS_PREFIX:event-banners}
event.storage.speaker-photos-prefix=${EVENT_STORAGE_SPEAKER_PHOTOS_PREFIX:speaker-photos}
