spring.datasource.url=jdbc:h2:mem:eventdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
event.jwt.secret=change-me-change-me-change-me-change-me-1234567890
event.jwt.issuer=eventzen-auth-service
event.client.venue-vendor-base-url=http://localhost:8083
event.client.notification-internal-service-key=test-internal-key
event.storage.enabled=false
event.cors.allowed-origins=http://localhost:5173
