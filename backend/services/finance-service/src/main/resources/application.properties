spring.application.name=finance-service
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
server.port=8085

# Production: set FINANCE_DB_URL / FINANCE_DB_USERNAME / FINANCE_DB_PASSWORD in the runtime environment.
spring.datasource.url=${FINANCE_DB_URL:jdbc:mysql://localhost:3306/eventzen_finance?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${FINANCE_DB_USERNAME:root}
spring.datasource.password=${FINANCE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.tracing.enabled=true
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

# Production: supply AUTH_JWT_SECRET from the shared auth-service secret store.
finance.jwt.secret=${AUTH_JWT_SECRET:}
finance.jwt.issuer=${AUTH_JWT_ISSUER:eventzen-auth-service}

# Production: replace localhost URLs/origins and internal keys with deployed values.
finance.cors.allowed-origins=${FINANCE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
finance.notification.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8086}
finance.notification.internal-service-key=${NOTIFICATION_INTERNAL_SERVICE_KEY:}
finance.ticketing.base-url=${TICKETING_SERVICE_BASE_URL:http://localhost:8084}
finance.ticketing.internal-service-key=${TICKETING_INTERNAL_SERVICE_KEY:${NOTIFICATION_INTERNAL_SERVICE_KEY:}}
finance.storage.enabled=${FINANCE_STORAGE_ENABLED:false}
finance.storage.endpoint=${FINANCE_STORAGE_ENDPOINT:}
finance.storage.access-key=${FINANCE_STORAGE_ACCESS_KEY:}
finance.storage.secret-key=${FINANCE_STORAGE_SECRET_KEY:}
finance.storage.bucket=${FINANCE_STORAGE_BUCKET:eventzen-media}
finance.storage.public-base-url=${FINANCE_STORAGE_PUBLIC_BASE_URL:}
finance.storage.invoices-prefix=${FINANCE_STORAGE_INVOICES_PREFIX:invoices}

# Production: set these env vars with real Razorpay values when online payment verification is required.
finance.razorpay.enabled=${FINANCE_RAZORPAY_ENABLED:false}
finance.razorpay.key-id=${FINANCE_RAZORPAY_KEY_ID:}
finance.razorpay.key-secret=${FINANCE_RAZORPAY_KEY_SECRET:}
finance.razorpay.checkout-name=${FINANCE_RAZORPAY_CHECKOUT_NAME:EventZen}
finance.razorpay.checkout-description=${FINANCE_RAZORPAY_CHECKOUT_DESCRIPTION:Event registration payment}
