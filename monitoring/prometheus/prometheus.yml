global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: event-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-service:8082"]

  - job_name: finance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["finance-service:8085"]

  - job_name: ticketing-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ticketing-service:8084"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8086"]

  - job_name: venue-vendor-service
    metrics_path: /metrics
    static_configs:
      - targets: ["venue-vendor-service:8083"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
